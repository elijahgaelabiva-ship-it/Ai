<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BLIP</title>
<style>
  :root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
  body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#cfe6ff;
       font:13px system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;touch-action:none}
  #stage svg{width:100%;height:100%;display:block}
  #gear{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:44px;height:44px;border-radius:50%;
        border:0;background:#111a;color:#9bd;font-size:22px;opacity:.3;z-index:3}
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:60%;overflow-y:auto;touch-action:pan-y;z-index:2;
         background:#0a1017f2;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box;
         transform:translateY(105%);transition:transform .22s ease-out}
  #panel.on{transform:none}
  .row{display:flex;align-items:center;gap:8px;margin:2px 0}
  .row label{flex:0 0 112px;font-size:12px;color:#9ab}
  .row input[type=range]{flex:1;min-width:0}
  .row output{flex:0 0 38px;text-align:right;font-variant-numeric:tabular-nums;color:#6cf}
  .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
  .btns button,.tools button{background:#16212c;color:#cfe6ff;border:1px solid #2a3a4a;border-radius:8px;padding:9px 2px;font-size:12px}
  .btns button.cur{border-color:#4fd8ff;color:#4fd8ff}
  .tools{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .tools button{flex:1}
  #say{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);text-align:center;font-size:20px;
       color:#8fdcff;text-shadow:0 0 12px #2bd;opacity:0;transition:opacity .45s;pointer-events:none;z-index:1;padding:0 20px}
  .bar{flex:1;height:8px;background:#16212c;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:#4fd8ff;transform-origin:left;transform:scaleX(0)}
  .mood{color:#6cf;margin:2px 0 8px;font-size:12px;line-height:1.4}
  .row input[type=text],.row input[type=password],.row input[type=number],.row textarea{width:100%;box-sizing:border-box;background:#16212c;color:#cfe6ff;
       border:1px solid #2a3a4a;border-radius:8px;padding:9px;font-size:15px;-webkit-user-select:text;user-select:text;flex:1;min-width:0}
  .row textarea{-webkit-text-security:disc;resize:none;font-size:13px}
  .sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 10px;justify-items:center}
  .sw button{width:36px;height:36px;border-radius:50%;border:2px solid #2a3a4a;padding:0}
  .sw button.cur{border-color:#fff;box-shadow:0 0 10px #fff8}
</style>
</head>
<body>
<div id="stage"></div>
<div id="say"></div>
<button id="gear" aria-label="Debug panel">⚙</button>
<div id="panel"></div>

<script>
(() => {
'use strict';

/* ================================================================
   1. PARAMETERS – the whole look is just these numbers.
   Eyes are plain circles (like the LOOI reference); emotions come
   from the size, the lids (top slant/droop, bottom squint/cheek),
   colour and gaze – no special glyph shapes.
   ================================================================ */
const PARAMS = [
  {id:'open',   label:'openness',            min:0,   max:1.3, def:1},
  {id:'slant',  label:'lid slant (+angry)',  min:-1,  max:1,   def:0},
  {id:'droop',  label:'lid droop',           min:0,   max:1,   def:0},
  {id:'squint', label:'squint (bottom lid)', min:0,   max:1,   def:0},
  {id:'cheek',  label:'cheek curve (happy)', min:0,   max:1,   def:0},
  {id:'w',      label:'eye width ×',         min:.85, max:1.15, def:1},
  {id:'h',      label:'eye height ×',        min:.85, max:1.15, def:1},
  {id:'round',  label:'roundness',           min:0,   max:1,   def:1},
  {id:'gx',     label:'gaze x',              min:-1,  max:1,   def:0},
  {id:'gy',     label:'gaze y',              min:-1,  max:1,   def:0},
  {id:'hue',    label:'colour (hue)',        min:0,   max:360, def:195, z:1},
  {id:'glow',   label:'glow intensity',      min:0,   max:1.5, def:.7, z:1},
  {id:'bounce', label:'bounce (laugh)',      min:0,   max:1,   def:0, z:1},
];
const DEF = {}; PARAMS.forEach(p => DEF[p.id] = p.def);

/* Emotions = sparse presets layered over the defaults. */
const PRESETS = {
  neutral:   {},
  happy:     {squint:.4, cheek:1, glow:.9},
  sad:       {slant:-.85, droop:.3, gy:.3, hue:210, glow:.5},
  angry:     {slant:.95, droop:.25, squint:.1, hue:2, glow:.9},
  sleepy:    {droop:.6, glow:.4, gy:.2},
  bored:     {droop:.5, glow:.45, gx:-.5, gy:.1},
  asleep:    {open:.06, glow:.2, hue:215},
  surprised: {glow:1},
  curious:   {hue:175},
  shy:       {squint:.3, cheek:.6, gx:-.6, gy:.4, glow:.6},
  laugh:     {squint:.4, cheek:1, bounce:1, glow:1},
  pet:       {squint:.4, cheek:1, glow:.9, hue:170},
  love:      {squint:.35, cheek:1, glow:1.1, hue:335},
  dizzy:     {squint:.3, cheek:.4, slant:.2, hue:285, glow:.9},
  yawn:      {squint:.5, cheek:.4, glow:.5},
  sulk:      {slant:.6, droop:.35, squint:.05, gx:-.4, gy:.2, hue:235, glow:.55},
};
const fullPreset = name => Object.assign({}, DEF, PRESETS[name]);

/* ================================================================
   2. STATE
   ================================================================ */
const cur = Object.assign({}, DEF, {open:0});   // starts closed, wakes up
const vel = {}; PARAMS.forEach(p => vel[p.id] = 0);
let base = fullPreset('neutral');
let over = null, overUntil = 0;     // temporary touch reaction on top of base
let life = true, currentName = 'neutral';
let talkAmt = 0, talkTarget = 0, tiltX = 0;     // Stage 3: eyes pulse while BLIP talks
const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
const rnd = (a,b) => a + Math.random()*(b-a);

/* ================================================================
   3. SVG – two circles-with-lids on black. Everything is drawn in
   left-eye space; the right eye is mirrored (inner side = +x).
   ================================================================ */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const svg = el('svg', {viewBox:'0 0 800 400', preserveAspectRatio:'xMidYMid meet'}, document.getElementById('stage'));
const defs = el('defs', {}, svg);
// Flat cyan with a darker rim, like the reference photos
const bodyGrad = el('radialGradient', {id:'bd', cx:'.45', cy:'.38', r:'.75'}, defs);
const bodyStops = [0,.6,1].map(o => el('stop', {offset:o}, bodyGrad));
const glowGrad = el('radialGradient', {id:'gl'}, defs);
const glowStops = [0,1].map(o => el('stop', {offset:o}, glowGrad));

function makeEye(cx, mirror, id){
  const pos  = el('g', {}, svg);                             // gaze position
  const glow = el('circle', {r:150, fill:'url(#gl)'}, pos);  // soft halo (no blur filter = fast)
  const m    = el('g', {}, pos);                             // mirror + breathing + blink
  const clip = el('clipPath', {id:'clip'+id}, defs);
  const lid  = el('path', {}, clip);                         // lid shape, rebuilt each frame
  const body = el('g', {'clip-path':'url(#clip'+id+')'}, m);
  const rect = el('rect', {fill:'url(#bd)'}, body);
  return {cx, mirror, pos, glow, m, lid, rect};
}
const eyes = [makeEye(0, 1, 'L'), makeEye(0, -1, 'R')];

/* FIXED eye size: computed from the screen (portrait or landscape), never from the mood.
   Same LOOI-style rounded-rectangle eye (height = 1.5 x width) on every orientation. */
const L = {cx:[0,0], cy:0, W:100, H:150, gx:20, gy:15};
const host = document.getElementById('stage');
function layout(){
  const vw = host.clientWidth || innerWidth, vh = host.clientHeight || innerHeight, A = 1.5;
  svg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
  const W = Math.min(vw*.98/2.82, vh*.64/A), H = W*A;               // fits both eyes + gaze travel; max 64% of the height
  const gap = clamp(vw*.9 - 2.4*W, .42*W, 1.4*W), off = gap/2 + W/2;
  L.W = W; L.H = H; L.cx = [vw/2 - off, vw/2 + off]; L.cy = vh/2; L.gx = W*.2; L.gy = H*.1;
  eyes.forEach(e => e.glow.setAttribute('r', (H*1.0).toFixed(1)));
}
addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 250));
if (window.ResizeObserver) new ResizeObserver(layout).observe(host);
layout();

/* Eye colour: bright neon choices (saved). Mood only changes the SHAPE unless "mood tint" is on. */
const LOOK = (() => {
  const KEY = 'blip.look.v1';
  const COLORS = [['Neon blue',215,100],['Cyan',186,100],['Neon green',135,100],['Lime',88,100],['Yellow',52,100],['Orange',24,100],
                  ['Red',354,100],['Hot pink',322,100],['Magenta',292,100],['Purple',262,100],['White',0,0],['Rainbow',-1,100]];
  const st = {c:0, mood:false};
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e){}
  if (!COLORS[st.c]) st.c = 0;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
  const hue = (t, moodHue) => { const C = COLORS[st.c]; let v = C[1] < 0 ? t*25 : C[1];
    if (st.mood && C[2]) v += moodHue - DEF.hue; return ((v % 360) + 360) % 360; };
  const sat = () => COLORS[st.c][2];
  function buildUI(){
    const btns = COLORS.map((C, i) => h('button', {title:C[0], onclick(){ st.c = i; save(); mark(); },
      style: C[1] < 0 ? 'background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)' : `background:hsl(${C[1]} ${C[2]}% ${C[2] ? 58 : 96}%)`}));
    const mark = () => btns.forEach((b, i) => b.classList.toggle('cur', i === st.c));
    const box = h('input', {type:'checkbox', checked:st.mood, onchange(){ st.mood = box.checked; save(); }});
    mark();
    return h('div', {}, [h('div', {className:'mood', textContent:'eye colour'}), h('div', {className:'sw'}, btns),
      h('label', {style:'display:block;color:#9ab;font-size:12px;margin-bottom:10px'}, [box, ' mood tint (angry = red, sad = deeper blue…)'])]);
  }
  return {hue, sat, buildUI};
})();

/* ================================================================
   4. SPRINGS – critically-damped-ish: smooth blend, tiny overshoot,
   no wobble. (Gaze is fully critically damped so it never shakes.)
   ================================================================ */
let gaze = {k:300, z:1};
let wx = 0, wy = 0, fingerGaze = false;

function step(dt, t, now){
  const T = (over && now < overUntil) ? over : (over = null, base);
  const amp = fingerGaze ? 1 : (1 - T.droop*.4) * (T.open < .2 ? 0 : 1);
  for (const p of PARAMS){
    let tg = T[p.id], k = 130, z = p.z || .6;
    if (p.id === 'open' && life) tg += .012*Math.sin(t*.8);   // barely-there life in the lids
    if (p.id === 'gx' || p.id === 'gy'){
      const off = p.id === 'gx' ? wx : wy;
      tg = clamp(fingerGaze ? off : T[p.id] + off*amp, -1, 1);
      k = gaze.k; z = gaze.z;
    }
    const c = 2*z*Math.sqrt(k);
    vel[p.id] += (k*(tg - cur[p.id]) - c*vel[p.id]) * dt;
    cur[p.id] += vel[p.id] * dt;
  }
}

/* ================================================================
   5. MICRO-LIFE – blinks (sometimes double), saccades, corner
   glances, slow look-arounds
   ================================================================ */
let blinkMul = 1, blink = 0, blinkStart = -1, doubleLeft = 0, nextBlink = 1.5;
let nextGaze = 0, gazeQueue = [], lastInput = 0;

function updateBlink(t){
  if (!life) { blink = 0; return; }
  if (blinkStart < 0 && t >= nextBlink){ blinkStart = t; doubleLeft = Math.random() < .22 ? 1 : 0; }
  if (blinkStart >= 0){
    const p = (t - blinkStart) / .17;
    blink = p < 0 ? 0 : Math.sin(Math.PI*Math.min(p,1));
    if (p >= 1){
      if (doubleLeft-- > 0) blinkStart = t + .08;
      else { blinkStart = -1; blink = 0; nextBlink = t + rnd(2.2, 6.5) * blinkMul; }
    }
  }
}
function randomGaze(t){
  const r = Math.random(), idleFor = t - lastInput;
  if (r < .20) return {x:wx+rnd(-.12,.12), y:wy+rnd(-.1,.1), hold:rnd(.3,.7), k:700, z:1};   // micro saccade
  if (r < .68) return {x:rnd(-.55,.55), y:rnd(-.35,.35), hold:rnd(.9,2.6), k:420, z:1};      // quick look
  if (r < .80) {                                                                            // corner glance, then back
    gazeQueue.push({x:rnd(-.2,.2), y:0, hold:rnd(.9,1.6), k:300, z:1});
    return {x:(Math.random()<.5?-1:1)*.9, y:rnd(-.7,.7), hold:rnd(.6,1), k:520, z:1};
  }
  if (r < .92 && idleFor > 6) {                                                             // slow look-around
    gazeQueue.push({x:.85, y:-.15, hold:1.6, k:22, z:1}, {x:-.2, y:.15, hold:1.2, k:30, z:1});
    return {x:-.85, y:-.1, hold:1.8, k:22, z:1};
  }
  return {x:rnd(-.35,.35), y:rnd(-.25,.25), hold:rnd(1,2), k:120, z:1};                     // lazy drift
}
function updateGaze(t){
  if (!life || fingerGaze || t < nextGaze) return;
  const a = gazeQueue.length ? gazeQueue.shift() : randomGaze(t);
  wx = a.x; wy = a.y; gaze = {k:a.k, z:a.z}; nextGaze = t + a.hold;
}

/* ================================================================
   6. RENDER
   ================================================================ */
let lastHueKey = '';
function render(t){
  const c = cur;
  const hue = LOOK.hue(t, c.hue), sat = LOOK.sat(), hk = hue.toFixed(1) + '|' + sat;
  if (hk !== lastHueKey){
    lastHueKey = hk;
    (sat ? [74,60,46] : [98,90,70]).forEach((l,i) => bodyStops[i].setAttribute('stop-color', `hsl(${hue.toFixed(1)} ${sat}% ${l}%)`));
    glowStops[0].setAttribute('stop-color', `hsla(${hue.toFixed(1)},${sat}%,${sat ? 58 : 90}%,.38)`);
    glowStops[1].setAttribute('stop-color', `hsla(${hue.toFixed(1)},${sat}%,${sat ? 58 : 90}%,0)`);
  }
  const gI = clamp(c.glow, 0, 1.5);
  const W = L.W * clamp(c.w, .85, 1.15), H0 = L.H * clamp(c.h, .85, 1.15);          // fixed size (tiny user trim only)
  const H = Math.max(.5, H0 * clamp(c.open, 0, 1));                                  // openness only closes the eye (sleep), never enlarges it
  talkAmt += (talkTarget - talkAmt) * .15;
  const pulse = talkAmt * (.5 + .5*Math.sin(t*13)*Math.sin(t*4.1 + 1));   // irregular, speech-like beat
  const br = 1 + .008*Math.sin(t*1.6) + pulse*.02;                  // slow breathing (very small)
  const sy = 1 - .96*blink;                            // blink squash
  const bob = c.bounce * Math.sin(t*14) * L.H*.03;     // only used while laughing
  const r = Math.min(W, H0)*.42;                        // LOOI-style rounded rectangle

  eyes.forEach((e, i) => {
    e.pos.setAttribute('transform', `translate(${(L.cx[i] + (c.gx + tiltX*.55)*L.gx).toFixed(2)} ${(L.cy + c.gy*L.gy + bob).toFixed(2)})`);
    e.m.setAttribute('transform', `scale(${(e.mirror*br).toFixed(4)} ${(br*sy).toFixed(4)})`);
    e.glow.setAttribute('opacity', clamp(gI + pulse*.35, 0, 1).toFixed(3));

    e.rect.setAttribute('x', -W/2); e.rect.setAttribute('y', -H/2);
    e.rect.setAttribute('width', W); e.rect.setAttribute('height', H);
    e.rect.setAttribute('rx', r.toFixed(1)); e.rect.setAttribute('ry', Math.min(r, H/2).toFixed(1));

    // Lids give the emotion, but they are capped so the eye never turns into a thin sliver:
    // top = droop + slant (slant>0 lowers inner corner = angry, <0 lowers outer = sad),
    // bottom = squint raises it, cheek curves it up in the middle (happy).
    const s = clamp(c.slant,-1,1), dr = clamp(c.droop,0,1)*H*.40;
    const yo = -H/2 + dr + Math.max(0,-s)*H*.30, yi = -H/2 + dr + Math.max(0,s)*H*.30;
    const yb = H/2 - clamp(c.squint,0,1)*H*.28, d = clamp(c.cheek,0,1)*H*.30;
    const X = W/2 + 30, slope = (yi - yo) / W;
    const top = x => Math.min(yo + slope*(x + W/2), yb - d - H*.32);   // always keep >= 32% of the eye visible
    e.lid.setAttribute('d', `M${-X} ${top(-X)} L${X} ${top(X)} L${X} ${yb} Q0 ${yb - 2*d} ${-X} ${yb} Z`);
  });
}

/* ================================================================
   7. TOUCH – tap = look at finger, hold top = pet, wiggle = tickle
   ================================================================ */
const stage = document.getElementById('stage');
let touch = null;
function setOver(name, ms){ over = fullPreset(name); overUntil = performance.now() + ms; }
function lookAtFinger(x, y){
  fingerGaze = true; gaze = {k:260, z:1};
  wx = clamp((x / innerWidth - .5) * 2.4, -1, 1);
  wy = clamp((y / innerHeight - .5) * 2.4, -1, 1);
}
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  touch = {sx:e.clientX, sy:e.clientY, lx:e.clientX, sg:0, revs:[], moved:0, t0:performance.now(),
           top:e.clientY < innerHeight*.38, pet:false};
  lastInput = performance.now()/1000;
  ENGINE.touch();
  lookAtFinger(e.clientX, e.clientY);
  if (!document.fullscreenElement && document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
});
stage.addEventListener('pointermove', e => {
  if (!touch) return;
  const now = performance.now();
  lastInput = now/1000;
  lookAtFinger(e.clientX, e.clientY);
  touch.moved = Math.max(touch.moved, Math.hypot(e.clientX - touch.sx, e.clientY - touch.sy));
  const dx = e.clientX - touch.lx;                     // count left/right direction flips
  if (Math.abs(dx) > 5){
    const s = Math.sign(dx);
    if (touch.sg && s !== touch.sg) touch.revs.push(now);
    touch.sg = s; touch.lx = e.clientX;
  }
  touch.revs = touch.revs.filter(r => now - r < 900);
  if (touch.revs.length >= 4){ touch.pet = false; setOver('laugh', 700); ENGINE.event('tickle'); }   // tickle
});
function endTouch(){
  if (!touch) return;
  const now = performance.now();
  if (touch.pet) overUntil = now + 900;
  else if (now - touch.t0 < 350 && touch.moved < 25){ setOver('curious', 900); ENGINE.event('tap'); }
  touch = null; fingerGaze = false; nextGaze = now/1000 + 1;
}
stage.addEventListener('pointerup', endTouch);
stage.addEventListener('pointercancel', endTouch);
function updateTouch(now){
  if (touch && !touch.pet && touch.top && touch.moved < 50 && now - touch.t0 > 450) touch.pet = true;
  if (touch && touch.pet){ over = fullPreset('pet'); overUntil = Infinity; }
}

/* ================================================================
   8. EMOTION ENGINE (Stage 2) – BLIP's inner life.
   Stats drift on their own, events push them, and the stats blend
   the eye presets continuously. It also acts on its own (director).
   ================================================================ */
const ENGINE = (() => {
  const KEY = 'blip.state.v2';
  const STATS = ['energy','happiness','affection','loneliness','boredom','curiosity','anxiety'];
  const PERSONALITY = {playful:.8, shy:.5, loyal:.9};
  /* Tuning knobs (1 = default). Editable live in the debug panel and saved. */
  const TUNE_KEY = 'blip.tune.v4';
  const TUNE0 = {lonely:1, bored:1, curious:1, events:1, expr:1, chatty:1, energyOff:0}, P0 = Object.assign({}, PERSONALITY);
  const TUNE = Object.assign({}, TUNE0);
  try { const t = JSON.parse(localStorage.getItem(TUNE_KEY)); if (t){ Object.assign(TUNE, t.tune); Object.assign(PERSONALITY, t.pers); } } catch(e){}
  const cdv = (a, b) => (a + Math.random()*(b - a)) / TUNE.chatty;     // behaviour cool-down, shorter when chattier          // fixed character (0..1)
  const BOND_NAMES = ['stranger','acquaintance','friend','close friend','best friend','soulmate'];
  const BOND_AT = [0,20,40,60,80,92];
  const WORDS = {sad:'lonely/droopy', happy:'happy', sleepy:'sleepy', bored:'bored', curious:'curious',
                 shy:'nervous', sulk:'sulky', asleep:'asleep'};
  const sayEl = document.getElementById('say');
  const pick = a => a[Math.random()*a.length | 0];
  const u = (v, lo, hi) => clamp((v-lo)/(hi-lo), 0, 1);       // 0..1 ramp

  const fresh = () => ({energy:70, happiness:60, affection:40, loneliness:20, boredom:30, curiosity:55,
                        anxiety:25, sulk:0, bond:30, idle:0, petSec:0, chatStreak:0, lastSeen:Date.now(), log:[]});
  let S = fresh(), auto = true, autoBox = null, tscale = 1, hourMode = 0;
  let busy = false, simT = 0, sleeping = false, sayT = 0, lastTickle = 0, weights = {};
  let acc = 0, wAcc = 0, saveAcc = 0, uiAcc = 0, refreshUI = () => {};
  const cd = {yawn:0, play:0, ask:0, call:0};                   // behaviour cool-downs (sim seconds)

  const hour = () => hourMode === 1 ? 2 : hourMode === 2 ? 14 : new Date().getHours();
  const timeEnergy = () => { const h = hour(); return (h >= 23 || h < 6) ? 10 : h < 9 ? 55 : h < 20 ? 75 : 50; };
  const bump = fx => { for (const k in fx) S[k] = clamp(S[k] + fx[k], 0, 100); };

  /* Pull complete {"text":..} objects out of the still-arriving JSON so the first sentence can start talking early */

  async function ask(text, onLine){
    hist.push({role:'user', parts:[{text}]});
    const contents = hist.slice(-12);
    while (contents.length && contents[0].role !== 'user') contents.shift();
    /* Streamed reply: each sentence is handed to the voice the moment it is complete (no waiting for the whole answer).
       Gemini 3 "thinks" at high level by default = slow. Ask for minimal thinking; if this model rejects that, fall back
       to the 2.5-style budget, then to nothing (remembered in cfg.think). */
    const url = `${API}/models/${encodeURIComponent(cfg.model)}:streamGenerateContent?alt=sse`;
    const tries = cfg.think === undefined ? [{thinkingLevel:'minimal'}, {thinkingBudget:0}, null] : [cfg.think];
    let res, data;
    for (const th of tries){
      const gc = {responseMimeType:'application/json', maxOutputTokens:500};
      if (th) gc.thinkingConfig = th;
      res = await gfetch(url, JSON.stringify({systemInstruction:{parts:[{text:systemPrompt()}]}, contents, generationConfig:gc}));
      if (res.ok){ cfg.think = th; break; }

  /* ---- Voice out: Gemini TTS (natural, emotional) with the phone voice as fallback ---- */

    curious:'curiously', surprised:'surprised and excited', neutral:'in a gentle, cute way'};

  /* Say one sentence: caption + voice (or a timer if voice is off) while the eyes pulse */

    const ms = Math.max(1800, text.length*90 + 800);
    ENGINE.say(text, ms + 1500, true);
    if (buf){ await playBuf(buf); talkTarget = 0; return; }
    return new Promise(done => {
      let fin = false; const end = () => { if (!fin){ fin = true; talkTarget = 0; done(); } };

  const makeQueue = () => { const items = []; let wake = null, closed = false;

            async next(){ while (!items.length){ if (closed) return null; await new Promise(r => wake = r); } return items.shift(); }}; };

  async function send(text){
    text = (text || '').trim(); if (!text || busy) return;
    if (!hasKeys()){ ENGINE.say('I need a Gemini key… (⚙)', 4000, true); panel.classList.add('on'); return; }
    busy = true; ENGINE.setBusy(true); ENGINE.touch();
    over = fullPreset('curious'); overUntil = Infinity;              // "thinking" look
    status('thinking…');
    const Q = makeQueue(), t0 = performance.now(); let n = 0;
    const enqueue = L => {                                           // called as each sentence arrives from the stream

      Q.push({L, emo, audio: cfg.voice && cfg.engine === 'gemini'

    };

        over = scaledPreset(EMO_PRESET[it.emo], .4 + .6*k); overUntil = Infinity;          // ...and react to this sentence

  /* Voice in – fully automatic. It listens all the time, answers when you pause, and listens again.

  function listen(){
    if (!SR){ status('no speech recognition in this browser'); convo = false; return; }
    if (!convo || busy || live || mute) return;
    rec = new SR(); rec.lang = cfg.lang; rec.interimResults = true; rec.maxAlternatives = 1; got = false; live = true;
    let lastTxt = '', sil = null;
    const finish = () => {                                           // you paused: send right away instead of waiting for the recogniser
      clearTimeout(sil); const t = lastTxt.trim();

    };
    rec.onresult = e => {
      lastTxt = Array.from(e.results).map(r => r[0].transcript).join(' ');
      if (!busy){ over = fullPreset('curious'); overUntil = performance.now() + 2500; }      // attentive look while it hears you
      clearTimeout(sil);

  /* ================================================================

  /* The live prompt = the same living-creature prompt (mood, bond, facts, events) without the JSON reply format */

    if (Array.isArray(calls) && calls.length){                       // the model tags its own emotion: reply "ok" so it keeps talking
      const res = calls.map(c => { if (c.name === 'set_emotion') toolEmotion(c.args || {}); return {id:c.id, name:c.name, response:{output:'ok'}}; });
      try { LV.ws && LV.ws.send(JSON.stringify({toolResponse:{functionResponses:res}})); } catch(e){}
    }
    const sc = m.serverContent; if (!sc) return;
    if (sc.interrupted) stopPlayback();
    if (sc.inputTranscription && sc.inputTranscription.text) onHeard(sc.inputTranscription.text);
    for (const p of ((sc.modelTurn || {}).parts || [])) if (p.inlineData && /audio/i.test(p.inlineData.mimeType || '')) playPcm(p.inlineData.data, p.inlineData.mimeType);
    if (sc.outputTranscription && sc.outputTranscription.text) onSaid(sc.outputTranscription.text);
    if (sc.turnComplete) onTurnDone();
  }

  function playPcm(data, mime){
    unlock(); if (!actx) return;
    if (actx.state !== 'running') actx.resume().catch(() => {});
    const bin = atob(data), n = bin.length >> 1, f = new Float32Array(n);
    for (let i = 0; i < n; i++){ let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i + 1) << 8); if (v > 32767) v -= 65536; f[i] = v/32768; }
    const rate = +((/rate=(\d+)/.exec(mime || '') || [])[1]) || 24000;
    const buf = actx.createBuffer(1, n, rate); buf.copyToChannel(f, 0);
    const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    LV.nextT = Math.max(LV.nextT, actx.currentTime + .03);
    src.start(LV.nextT); LV.nextT += buf.duration; LV.srcs.add(src); src.onended = () => LV.srcs.delete(src);
    if (!LV.turn){ LV.turn = true; ENGINE.setBusy(true); }
    talkTarget = 1; armTalkEnd();
  }
  function stopPlayback(){ LV.srcs.forEach(x => { try { x.stop(); } catch(e){} }); LV.srcs.clear(); LV.nextT = 0; talkTarget = 0; }
  function armTalkEnd(){                                             // eyes stop pulsing + mic re-opens when the last sound has played
    clearTimeout(LV.talkT);
    LV.talkT = setTimeout(() => {
      if (liveSpeaking()){ armTalkEnd(); return; }
      talkTarget = 0; LV.gateUntil = performance.now() + 350; LV.turn = false; ENGINE.setBusy(false); overUntil = performance.now() + 500;
    }, Math.max(0, (LV.nextT - (actx ? actx.currentTime : 0))*1000) + 250);
  }

  /* The face reacts to the words (the model's audio has no emotion tag): keyword -> emotion, engine nudged as before */
  const LIVE_EMO = [['love', /\b(love|miss(ed)? you|adore|aww+)\b/i], ['playful', /\b(ha(ha)+|hehe+|lol|giggle|silly|tickle|play)\b/i],
    ['sad', /\b(sad|sorry|cry|lonely|oh no|hurt)\b/i], ['angry', /\b(angry|mad|grumpy|hmph|not nice)\b/i], ['scared', /\b(scared|afraid|nervous|spooky)\b/i],
    ['surprised', /\b(wow|whoa|no way|really)\b/i], ['sleepy', /\b(sleepy|tired|yawn|zzz|nap)\b/i],
    ['happy', /\b(yay|great|awesome|happy|fun|hi|hello|hey|nice)\b|!/i], ['curious', /\?/]];
  function onHeard(t){
    LV.inTxt += t; ENGINE.touch();
    if (!LV.turn){ LV.turn = true; ENGINE.setBusy(true); }
    if (!liveSpeaking()){ over = fullPreset('curious'); overUntil = performance.now() + 3000; }   // attentive look while it hears you
  }
  function toolEmotion(a){
    const emo = EMO_PRESET[a.emotion] ? a.emotion : 'neutral', k = clamp(+a.intensity || .6, 0, 1);
    LV.toolSeen = true; LV.emo = emo; ENGINE.nudge(emo, k*.8);
    over = scaledPreset(EMO_PRESET[emo], .4 + .6*k); overUntil = Infinity;          // face follows the model's own tag, per sentence
  }
  function onSaid(t){
    LV.outTxt += t; ENGINE.say(LV.outTxt.slice(-140), 3500, true);
    if (LV.toolSeen) return;                                         // real tags beat guessing from words
    let emo = ''; for (const [e, re] of LIVE_EMO) if (re.test(LV.outTxt)){ emo = e; break; }
    if (emo && emo !== LV.emo){ LV.emo = emo; ENGINE.nudge(emo, .6); over = scaledPreset(EMO_PRESET[emo], .8); overUntil = Infinity; }
    else if (!LV.emo && overUntil === Infinity) overUntil = 0;       // no clear emotion: show the mood face
  }
  function onTurnDone(){
    const u = LV.inTxt.trim(), b = LV.outTxt.trim(); LV.inTxt = LV.outTxt = ''; LV.emo = ''; LV.toolSeen = false;
    if (u || b){
      LV.recap = LV.recap.concat({u:u || '…', b:b || '…'}).slice(-6);
      hist.push({role:'user', parts:[{text:u || '…'}]}, {role:'model', parts:[{text:b || '…'}]}); store();
    }
    ENGINE.event(/\b(good (boy|job|girl)|well done|i love you|great job|you('| a)re (great|awesome|the best|cute))\b/i.test(u) ? 'praise'
               : /\b(shut up|stupid|bad (boy|blip)|i hate you|go away|you('| a)re (dumb|useless))\b/i.test(u) ? 'scold' : 'chat', true);
    armTalkEnd();
  }
  setInterval(() => {                                                // health check: Live should be ON -> make sure it is
    if (!LV.on || LV.explicit) return;
    if (LV.ws && !LV.ready && Date.now() - LV.openedAt > 12000){ try { LV.ws.close(); } catch(e){} return; }
    if (!LV.ws) liveRetry(0);
  }, 12000);
  addEventListener('online', () => { if (LV.on && !LV.ws) liveRetry(0); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (LV.on && !LV.ws) liveRetry(0);
    if (LV.ctx && LV.ctx.state === 'suspended') LV.ctx.resume().catch(() => {});
  });

  function autoStart(){                                              // no buttons: it just starts
    if (started) return;
    if (!window.isSecureContext){ status('Voice needs https – host the app (Netlify / GitHub Pages).'); return; }
    if (!hasKeys()) return;
    if (useLive()){ started = true; startLive().then(ok => { if (!ok) started = false; }); return; }
    if (!SR){ status('no speech recognition in this browser'); return; }
    started = true; convo = true; listen();
  }
  const restartVoice = () => { convo = false; try { rec && rec.abort(); } catch(e){} stopLive(); started = false; autoStart(); };
  const hush = on => { mute = on; if (on){ try { rec && rec.abort(); } catch(e){} } else if (convo && !busy) setTimeout(listen, 400); };
  addEventListener('pointerdown', () => { if (!started) autoStart(); else if (LV.on){ if (LV.ctx && LV.ctx.state === 'suspended') LV.ctx.resume().catch(() => {}); if (!LV.ws) liveRetry(0); } else if (convo && !live && !busy && !mute) listen(); });   // first tap = browser allows mic + audio
  setTimeout(autoStart, 1800);

  /* On-screen controls + settings in the debug panel */
  function buildUI(){
    const wrap = h('div'); statusEl = h('div', {className:'mood', textContent:'brain: add a key (⚙) – then just talk to me'});
    const field = (label, k, type) => h('div', {className:'row'}, [h('label', {textContent:label}),
      h('input', {type, value:cfg[k], onchange(e){ cfg[k] = e.target.value.trim(); store(); }})]);
    const sel = h('select', {style:'flex:1;background:#16212c;color:#cfe6ff;border:1px solid #2a3a4a;border-radius:6px;padding:7px',
      onchange(){ cfg.engine = sel.value; store(); }},
      [h('option', {value:'gemini', textContent:'Gemini (natural)'}), h('option', {value:'phone', textContent:'Phone (robotic)'})]);
    sel.value = cfg.engine;
    const engineRow = h('div', {className:'row'}, [h('label', {textContent:'voice engine'}), sel]);
    const voiceBox = h('input', {type:'checkbox', checked:cfg.voice, onchange(){ cfg.voice = voiceBox.checked; store(); }});
    const keysIn = h('textarea', {rows:3, value:cfg.keys, spellcheck:false, autocomplete:'off', placeholder:'one key per line – BLIP switches to the next when one runs out',
      onchange(){ cfg.keys = keysIn.value; for (const k in ks) ks[k].dead = false; store(); saveKs(); status(keyReport()); autoStart(); }});
    const numField = (label, k) => h('div', {className:'row'}, [h('label', {textContent:label}),
      h('input', {type:'number', min:0, value:cfg[k], onchange(e){ cfg[k] = Math.max(0, +e.target.value || 0); store(); }})]);
    const modeSel = h('select', {style:'flex:1;background:#16212c;color:#cfe6ff;border:1px solid #2a3a4a;border-radius:6px;padding:7px',
      onchange(){ cfg.mode = modeSel.value; LV.failed = false; store(); restartVoice(); }},
      [h('option', {value:'live', textContent:'Live (fast, never stops)'}), h('option', {value:'classic', textContent:'Classic (text + TTS)'})]);
    modeSel.value = cfg.mode;
    const bargeBox = h('input', {type:'checkbox', checked:cfg.barge, onchange(){ cfg.barge = bargeBox.checked; store(); }});
    const toolBox = h('input', {type:'checkbox', checked:cfg.tool, onchange(){ cfg.tool = toolBox.checked; LV.toolOff = false; try { localStorage.removeItem('blip.live.tool.off'); } catch(e){} store(); restartVoice(); }});
    wrap.append(statusEl, h('div', {className:'row'}, [h('label', {textContent:'voice mode'}), modeSel]), field('live model', 'liveModel', 'text'),
      h('label', {style:'display:block;color:#9ab;font-size:12px;margin:2px 0 6px'}, [bargeBox, ' let me interrupt it (only with earphones – otherwise it hears itself)']),
      h('label', {style:'display:block;color:#9ab;font-size:12px;margin:2px 0 6px'}, [toolBox, ' emotion tags from the model (Live) – off = guess from words']),
      h('div', {className:'row'}, [h('label', {textContent:'Gemini API keys'}), keysIn]),
      numField('switch key at calls/min (0=off)', 'rpm'), numField('switch key at calls/day (0=off)', 'rpd'), field('model', 'model', 'text'),
      field('your name', 'name', 'text'), field('speech language', 'lang', 'text'), engineRow,
      field('voice name', 'voiceName', 'text'), field('voice model', 'ttsModel', 'text'),
      h('div', {className:'tools'}, [h('label', {style:'flex:1;color:#9ab;font-size:12px'}, [voiceBox, ' voice out']),
        h('button', {textContent:'Test: say hi', onclick(){ if (LV.on) status('Live is on – just say hi out loud'); else send('hi BLIP!'); }}),
        h('button', {textContent:'Test voice', onclick(){ status('loading voice…');
          ttsFetch('Hi! I am Blip, and I am so happy to see you!', 'happy').then(b => { status('playing'); talkTarget = 1; return playBuf(b); })
            .then(() => { talkTarget = 0; }).catch(e => { talkTarget = 0; status('voice error: ' + e.message); }); }}),
        h('button', {textContent:'Forget chat', onclick(){ hist = []; store(); status('chat memory cleared'); }})]),
      h('div', {className:'tools'}, [
        h('button', {textContent:'Key status', onclick(){ status(keyReport()); }}),
        h('button', {textContent:'What do you know?', onclick(){ status(facts.length ? 'I know: ' + facts.join(' · ') : 'no facts yet'); }}),
        h('button', {textContent:'Forget facts', onclick(){ facts = []; try { localStorage.removeItem(FACT_KEY); } catch(e){} status('facts forgotten'); }})]));
    return wrap;
  }

  /* Spontaneous lines from the engine (questions, greetings) are spoken too; "*actions*" stay text only */
  ENGINE.onSay = async text => {
    if (!cfg.voice || busy || /^(zzz|\*)/i.test(text)) return;
    if (LV.on && (LV.turn || liveSpeaking())) return;                // never talk over the live conversation
    hush(true);                                                      // mic off while it talks to itself
    try {
      if (cfg.engine === 'gemini' && hasKeys()){
        try { const b = await ttsFetch(text, 'neutral'); if (busy) return; talkTarget = 1; await playBuf(b); if (!busy) talkTarget = 0; return; } catch(e){}
      }
      if (!('speechSynthesis' in window)) return;
      await new Promise(done => { talkTarget = 1; phoneSay(text, 'neutral', done); setTimeout(done, 8000); });
      if (!busy) talkTarget = 0;
    } finally { hush(false); }
  };
  return {buildUI, send, cfg};
})();

/* ================================================================
  10. PHONE SENSES + INSTALL – it notices being lifted, tilted, shaken
      or turned upside down, and the app can be installed to the home screen.
   ================================================================ */
const SENSE = (() => {
  const G = 9.81;
  let lastMove = performance.now(), lastPush = 0, spikes = [], shakes = [], lastReact = 0;
  let flipSince = 0, flipped = false, tilt = 0, installEv = null, installBtn = null;
  const pick = a => a[Math.random()*a.length | 0];

  function shaken(now){
    ENGINE.touch();
    shakes = shakes.filter(t => now - t < 30000); shakes.push(now);
    if (shakes.length >= 3){                               // shaken again and again = it gets upset
      ENGINE.bump({happiness:-6, anxiety:6, sulk:15}); ENGINE.state.bond = clamp(ENGINE.state.bond - 1, 0, 100);
      ENGINE.log('shook me hard'); ENGINE.say(pick(['hey! stop shaking me!','that is not nice…']), 2600); setOver('sulk', 2600);
    } else {                                               // one shake = funny dizzy spin
      ENGINE.bump({energy:-1, happiness:-1});
      for (let k = 0; k < 10; k++){ const a = k*.9; gazeQueue.push({x:Math.cos(a)*.9, y:Math.sin(a)*.7, hold:.14, k:700, z:1}); }
      nextGaze = 0; setOver('dizzy', 2200); ENGINE.say(pick(['whoa whoa whoa…','*dizzy*','too… fast…']), 2400);
    }
  }
  function onMotion(e){
    const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
    const now = performance.now(), dev = Math.abs(Math.hypot(a.x, a.y, a.z) - G);
    const ang = (screen.orientation && screen.orientation.angle) || 0;            // convert to screen directions
    const right = ang === 90 ? -a.y : ang === 270 ? a.y : ang === 180 ? -a.x : a.x;
    const up    = ang === 90 ?  a.x : ang === 270 ? -a.x : ang === 180 ? -a.y : a.y;
    tilt += (clamp(-right/G, -1, 1) - tilt) * .08; tiltX = tilt;                  // eyes roll toward the low side
    if (dev > 12 && now - lastPush > 80){ lastPush = now; spikes.push(now); }       // shake = several hard spikes in 1s
    spikes = spikes.filter(t => now - t < 1000);
    if (spikes.length >= 4 && now - lastReact > 2500){ lastReact = now; spikes = []; shaken(now); return; }
    if (dev > 2.5){                                                                // lifted after resting a while
      if (now - lastMove > 30000){ ENGINE.touch(); ENGINE.log('picked me up'); }
      lastMove = now;
    }
    if (up < -6){                                                                  // upside down for 1.5s
      if (!flipSince) flipSince = now;
      else if (!flipped && now - flipSince > 1500){ flipped = true; setOver('surprised', 2200); ENGINE.say('the world is upside down!', 2500); }
    } else { flipSince = 0; flipped = false; }
  }
  if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission)   // iOS asks first
    addEventListener('pointerdown', () => DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') addEventListener('devicemotion', onMotion); }).catch(() => {}), {once:true});
  else addEventListener('devicemotion', onMotion);

  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; if (installBtn) installBtn.style.display = ''; });
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

  function buildUI(){
    installBtn = h('button', {textContent:'Install app', style:'display:none', onclick(){ if (installEv) installEv.prompt(); }});
    if (installEv) installBtn.style.display = '';
    return h('div', {}, [h('div', {className:'mood', textContent:'phone: shake me, tilt me, flip me, lift me. Install: Chrome ⋮ menu → Install app'}),
      h('div', {className:'tools'}, [installBtn])]);
  }
  return {buildUI};
})();

/* ================================================================
  11. MAIN LOOP
   ================================================================ */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.033, (now - last)/1000); last = now;
  const t = now/1000;
  updateTouch(now); ENGINE.frame(dt, !!(touch && touch.pet)); updateBlink(t); updateGaze(t);
  step(dt, t, now); render(t);
}
requestAnimationFrame(frame);

/* ================================================================
  12. DEBUG PANEL
   ================================================================ */
const panel = document.getElementById('panel');
const sliders = {};
function h(tag, props, kids){
  const n = Object.assign(document.createElement(tag), props || {});
  (kids || []).forEach(k => n.append(k));
  return n;
}
const btnWrap = h('div', {className:'btns'});
const btnEls = {};
Object.keys(PRESETS).forEach(name => {
  btnEls[name] = h('button', {textContent:name, onclick(){
    ENGINE.setManual(); base = fullPreset(name); currentName = name; nextBlink = Math.min(nextBlink, performance.now()/1000 + .2);
    syncUI();
  }});
  btnWrap.append(btnEls[name]);
});
const lifeBox = h('input', {type:'checkbox', checked:true, onchange(){ life = lifeBox.checked; }});
const tools = h('div', {className:'tools'}, [
  h('button', {textContent:'Fullscreen', onclick(){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); }}),
  h('button', {textContent:'Copy values', onclick(){
    const out = {}; PARAMS.forEach(p => { if (Math.abs(base[p.id] - DEF[p.id]) > .001) out[p.id] = +(+base[p.id]).toFixed(2); });
    const txt = JSON.stringify(out);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => prompt('Copy:', txt));
  }}),
  h('label', {style:'flex:1;color:#9ab;font-size:12px;text-align:center'}, [lifeBox, ' idle life']),
]);
panel.append(LOOK.buildUI(), BRAIN.buildUI(), SENSE.buildUI(), ENGINE.buildUI(), btnWrap, tools);
PARAMS.forEach(p => {
  if (p.id === 'hue') return;                       // colour is chosen with the neon swatches now
  const out = h('output');
  const inp = h('input', {type:'range', min:p.min, max:p.max, step:(p.max-p.min)/200, value:p.def,
    oninput(){ ENGINE.setManual(); base[p.id] = +inp.value; out.textContent = (+inp.value).toFixed(2); }});
  sliders[p.id] = {inp, out};
  panel.append(h('div', {className:'row'}, [h('label', {textContent:p.label}), inp, out]));
});
function syncUI(){
  PARAMS.forEach(p => { if (!sliders[p.id]) return; sliders[p.id].inp.value = base[p.id]; sliders[p.id].out.textContent = (+base[p.id]).toFixed(2); });
  Object.keys(btnEls).forEach(n => btnEls[n].classList.toggle('cur', n === currentName));
}
syncUI();
document.getElementById('gear').addEventListener('click', () => panel.classList.toggle('on'));
})();
</script>
