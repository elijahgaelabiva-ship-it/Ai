<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BLIP – Stage 2: Emotion Engine</title>
<style>
  :root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
  body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#cfe6ff;
       font:13px system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;touch-action:none}
  #stage svg{width:100%;height:100%;display:block}
  #gear{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:44px;height:44px;border-radius:50%;
        border:0;background:#111a;color:#9bd;font-size:22px;opacity:.3;z-index:3}
  #cam{position:fixed;right:60px;top:calc(env(safe-area-inset-top,0px) + 10px);width:44px;height:44px;border-radius:50%;
        border:0;background:#111a;color:#9bd;font-size:20px;opacity:.3;z-index:3}
  #cam.on{opacity:.9;background:#0a3a4acc}
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:60%;overflow-y:auto;touch-action:pan-y;z-index:2;
         background:#0a1017f2;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box;
         transform:translateY(105%);transition:transform .22s ease-out}
  #panel.on{transform:none}
  .row{display:flex;align-items:center;gap:8px;margin:2px 0}
  .row label{flex:0 0 112px;font-size:12px;color:#9ab}
  .row input[type=range]{flex:1;min-width:0}
  .row output{flex:0 0 38px;text-align:right;font-variant-numeric:tabular-nums;color:#6cf}
  .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
  .btns button,.tools button{background:#16212c;color:#cfe6ff;border:1px solid #2a3a4a;border-radius:8px;padding:9px 2px;font-size:12px}
  .btns button.cur{border-color:#4fd8ff;color:#4fd8ff}
  .tools{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .tools button{flex:1}
  #cap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font-size:18px;
       color:#8fdcff;opacity:0;transition:opacity .4s;pointer-events:none;z-index:1;padding:0 16px}
  #cap.on{opacity:.85}
  .sec{margin:10px 0 2px;font-size:11px;letter-spacing:.08em;color:#6a8;text-transform:uppercase}
  .bar{flex:1;height:8px;background:#1b2a38;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:#4fd8ff;width:0}
  #feel{color:#4fd8ff;font-size:14px;margin:2px 0 6px}
</style>
</head>
<body>
<div id="stage"></div>
<button id="cam" aria-label="Camera tracking">👁</button>
<button id="gear" aria-label="Debug panel">⚙</button>
<div id="cap"></div>
<div id="panel"></div>

<script>
(() => {
'use strict';

/* ================================================================
   1. PARAMETERS – the whole look is just these numbers.
   Eyes are plain circles (like the LOOI reference); emotions come
   from the size, the lids (top slant/droop, bottom squint/cheek),
   colour and gaze – no special glyph shapes.
   ================================================================ */
const PARAMS = [
  {id:'open',   label:'openness',            min:0,   max:1.3, def:1},
  {id:'slant',  label:'lid slant (+angry)',  min:-1,  max:1,   def:0},
  {id:'droop',  label:'lid droop',           min:0,   max:1,   def:0},
  {id:'squint', label:'squint (bottom lid)', min:0,   max:1,   def:0},
  {id:'cheek',  label:'cheek curve (happy)', min:0,   max:1,   def:0},
  {id:'w',      label:'eye width',           min:50,  max:230, def:125},
  {id:'h',      label:'eye height',          min:50,  max:270, def:125},
  {id:'round',  label:'roundness',           min:0,   max:1,   def:1},
  {id:'gx',     label:'gaze x',              min:-1,  max:1,   def:0},
  {id:'gy',     label:'gaze y',              min:-1,  max:1,   def:0},
  {id:'hue',    label:'colour (hue)',        min:0,   max:360, def:195, z:1},
  {id:'glow',   label:'glow intensity',      min:0,   max:1.5, def:.7, z:1},
  {id:'bounce', label:'bounce (laugh)',      min:0,   max:1,   def:0, z:1},
];
const DEF = {}; PARAMS.forEach(p => DEF[p.id] = p.def);

/* Emotions = sparse presets layered over the defaults. */
const PRESETS = {
  neutral:   {},
  happy:     {squint:.4, cheek:1, glow:.9},
  sad:       {slant:-.85, droop:.3, h:130, gy:.3, hue:210, glow:.5},
  angry:     {slant:.95, droop:.25, squint:.1, w:135, h:120, hue:2, glow:.9},
  sleepy:    {droop:.55, open:.8, glow:.4, gy:.2},
  bored:     {droop:.5, open:.85, glow:.45, gx:-.5, gy:.1},
  asleep:    {open:.06, glow:.2, hue:215},
  surprised: {w:150, h:160, open:1.1, glow:1, pupil:0},
  curious:   {open:1.1, w:115, h:150, hue:175},
  shy:       {squint:.3, cheek:.6, gx:-.6, gy:.4, glow:.6},
  lonely:    {slant:-.75, droop:.35, h:122, gy:.4, hue:212, glow:.4},
  sulky:     {slant:.55, droop:.5, gx:.65, gy:.15, hue:200, glow:.45},
  worried:   {slant:-.5, droop:.12, open:1.05, gy:.15, hue:205, glow:.6},
  excited:   {open:1.15, w:132, h:138, cheek:.5, squint:.2, glow:1.1, hue:172},
  squeeze:   {open:.4, squint:.5, droop:.3, w:140, glow:.6},
  laugh:     {squint:.4, cheek:1, bounce:1, glow:1},
  pet:       {squint:.4, cheek:1, glow:.9, hue:170},
};
const fullPreset = name => Object.assign({}, DEF, PRESETS[name]);

/* ================================================================
   2. STATE
   ================================================================ */
const cur = Object.assign({}, DEF, {open:0});   // starts closed, wakes up
const vel = {}; PARAMS.forEach(p => vel[p.id] = 0);
let base = fullPreset('neutral');
let over = null, overUntil = 0;     // temporary touch reaction on top of base
let life = true, currentName = 'neutral';
const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
const rnd = (a,b) => a + Math.random()*(b-a);

/* ================================================================
   3. SVG – two circles-with-lids on black. Everything is drawn in
   left-eye space; the right eye is mirrored (inner side = +x).
   ================================================================ */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const svg = el('svg', {viewBox:'0 0 800 400', preserveAspectRatio:'xMidYMid meet'}, document.getElementById('stage'));
const defs = el('defs', {}, svg);
// Flat cyan with a darker rim, like the reference photos
const bodyGrad = el('radialGradient', {id:'bd', cx:'.45', cy:'.38', r:'.75'}, defs);
const bodyStops = [0,.6,1].map(o => el('stop', {offset:o}, bodyGrad));
const glowGrad = el('radialGradient', {id:'gl'}, defs);
const glowStops = [0,1].map(o => el('stop', {offset:o}, glowGrad));

function makeEye(cx, mirror, id){
  const pos  = el('g', {}, svg);                             // gaze position
  const glow = el('circle', {r:170, fill:'url(#gl)'}, pos);  // soft halo (no blur filter = fast)
  const m    = el('g', {}, pos);                             // mirror + breathing + blink
  const clip = el('clipPath', {id:'clip'+id}, defs);
  const lid  = el('path', {}, clip);                         // lid shape, rebuilt each frame
  const body = el('g', {'clip-path':'url(#clip'+id+')'}, m);
  const rect = el('rect', {fill:'url(#bd)'}, body);
  return {cx, mirror, pos, glow, m, lid, rect};
}
const eyes = [makeEye(0, 1, 'L'), makeEye(0, -1, 'R')];

/* Layout: the viewBox equals the screen in pixels. Eye diameter D fills
   the screen like LOOI (about 42% of the width, or 90% of the height). */
let sc = 1, cxs = [0,0], cyy = 0, gxT = 0, gyT = 0;   // gxT/gyT = how far the eyes can travel (px)
function layout(){
  const vw = innerWidth, vh = innerHeight;
  svg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
  const D = Math.min(vw*.3, vh*.6);           // sized so there is room left over for big gaze shifts
  sc = D/125;                                  // param units -> pixels
  cxs = [vw/2 - D*.6, vw/2 + D*.6]; cyy = vh/2;
  gxT = D*.5;                                  // sideways travel: half an eye width
  gyT = vh > vw ? D*.8 : D*.3;                 // portrait has more vertical room
}
layout();
addEventListener('resize', layout); addEventListener('orientationchange', layout);

/* ================================================================
   4. SPRINGS – critically-damped-ish: smooth blend, tiny overshoot,
   no wobble. (Gaze is fully critically damped so it never shakes.)
   ================================================================ */
let gaze = {k:300, z:1};
let wx = 0, wy = 0, fingerGaze = false;

function step(dt, t, now){
  const T = (over && now < overUntil) ? over : (over = null, base);
  const amp = (fingerGaze || trackGaze) ? 1 : (1 - T.droop*.4) * (T.open < .2 ? 0 : 1);
  for (const p of PARAMS){
    let tg = T[p.id], k = 130, z = p.z || .6;
    if (T === base && auto){                                   // mood fine-tunes the face continuously
      if (p.id === 'open') tg *= .8 + .2*S.energy/100;           // tired = lids heavier
      if (p.id === 'glow') tg *= .55 + .45*(S.happiness + S.energy)/200;
    }
    if (p.id === 'open' && life) tg += .012*Math.sin(t*.8);   // barely-there life in the lids
    if (p.id === 'gx' || p.id === 'gy'){
      const off = p.id === 'gx' ? wx : wy;
      tg = clamp((fingerGaze || trackGaze) ? off : T[p.id] + off*amp, -1, 1);
      k = gaze.k; z = gaze.z;
    }
    const c = 2*z*Math.sqrt(k);
    vel[p.id] += (k*(tg - cur[p.id]) - c*vel[p.id]) * dt;
    cur[p.id] += vel[p.id] * dt;
  }
}

/* ================================================================
   5. MICRO-LIFE – blinks (sometimes double), saccades, corner
   glances, slow look-arounds
   ================================================================ */
let blink = 0, blinkStart = -1, doubleLeft = 0, nextBlink = 1.5;
let nextGaze = 0, gazeQueue = [], lastInput = 0;

function updateBlink(t){
  if (!life) { blink = 0; return; }
  if (blinkStart < 0 && t >= nextBlink){ blinkStart = t; doubleLeft = Math.random() < .22 ? 1 : 0; }
  if (blinkStart >= 0){
    const p = (t - blinkStart) / .17;
    blink = p < 0 ? 0 : Math.sin(Math.PI*Math.min(p,1));
    if (p >= 1){
      if (doubleLeft-- > 0) blinkStart = t + .08;
      else { blinkStart = -1; blink = 0; nextBlink = t + rnd(2.2, 6.5); }
    }
  }
}
function randomGaze(t){
  const r = Math.random(), idleFor = t - lastInput;
  if (r < .20) return {x:wx+rnd(-.12,.12), y:wy+rnd(-.1,.1), hold:rnd(.3,.7), k:700, z:1};   // micro saccade
  if (r < .68) return {x:rnd(-.85,.85), y:rnd(-.55,.55), hold:rnd(.9,2.6), k:480, z:1};      // quick look
  if (r < .80) {                                                                            // corner glance, then back
    gazeQueue.push({x:rnd(-.2,.2), y:0, hold:rnd(.9,1.6), k:300, z:1});
    return {x:(Math.random()<.5?-1:1)*1, y:rnd(-.7,.7), hold:rnd(.6,1), k:520, z:1};
  }
  if (r < .92 && idleFor > 6) {                                                             // slow look-around
    gazeQueue.push({x:.85, y:-.15, hold:1.6, k:22, z:1}, {x:-.2, y:.15, hold:1.2, k:30, z:1});
    return {x:-.85, y:-.1, hold:1.8, k:22, z:1};
  }
  return {x:rnd(-.5,.5), y:rnd(-.35,.35), hold:rnd(1,2), k:140, z:1};                     // lazy drift
}
function updateGaze(t){
  if (!life || fingerGaze || trackGaze || t < nextGaze) return;
  const a = gazeQueue.length ? gazeQueue.shift() : randomGaze(t);
  wx = a.x; wy = a.y; gaze = {k:a.k, z:a.z}; nextGaze = t + a.hold;
}

/* ================================================================
   6. RENDER
   ================================================================ */
let lastHue = -99;
function render(t){
  const c = cur;
  const hue = ((c.hue % 360) + 360) % 360;
  if (Math.abs(hue - lastHue) > .3){
    lastHue = hue;
    ['66','56','40'].forEach((l,i) => bodyStops[i].setAttribute('stop-color', `hsl(${hue} 95% ${l}%)`));
    glowStops[0].setAttribute('stop-color', `hsla(${hue},100%,55%,.35)`);
    glowStops[1].setAttribute('stop-color', `hsla(${hue},100%,55%,0)`);
  }
  const gI = clamp(c.glow, 0, 1.5);
  const W = Math.max(8, c.w), H = Math.max(.5, c.h * Math.max(0, c.open));
  const br = 1 + .012*Math.sin(t*1.6);                 // slow breathing (very small)
  const sy = 1 - .96*blink;                            // blink squash
  const bob = c.bounce * Math.sin(t*14) * 5;           // only used while laughing

  for (const e of eyes){
    // gaze moves the eye, then the position is clamped so the eye never leaves the screen
    const hw = W*sc/2*1.03 + 6, hh = H*sc/2*1.03 + 6;
    const px = clamp(cxs[e.mirror>0?0:1] + c.gx*gxT, hw, innerWidth - hw);
    const py = clamp(cyy + c.gy*gyT + bob*sc, hh, innerHeight - hh);
    e.pos.setAttribute('transform', `translate(${px.toFixed(2)} ${py.toFixed(2)})`);
    e.m.setAttribute('transform', `scale(${(e.mirror*br*sc).toFixed(4)} ${(br*sy*sc).toFixed(4)})`);
    e.glow.setAttribute('opacity', clamp(gI, 0, 1).toFixed(3)); e.glow.setAttribute('r', (170*sc).toFixed(0));

    e.rect.setAttribute('x', -W/2); e.rect.setAttribute('y', -H/2);
    e.rect.setAttribute('width', W); e.rect.setAttribute('height', H);
    e.rect.setAttribute('rx', (clamp(c.round,0,1) * Math.min(W,H)/2).toFixed(1));

    // Lids. Top: droop + slant (slant>0 lowers inner corner = angry, <0 lowers outer = sad).
    // Bottom: squint raises it, cheek curves it upward in the middle (happy).
    const s = clamp(c.slant,-1,1), dr = clamp(c.droop,0,1)*H*.62;
    const yo = -H/2 + dr + Math.max(0,-s)*H*.62, yi = -H/2 + dr + Math.max(0,s)*H*.62;
    const yb = H/2 - clamp(c.squint,0,1)*H*.55, d = clamp(c.cheek,0,1)*H*.55;
    const X = W/2 + 30, slope = (yi - yo) / W;
    const top = x => Math.min(yo + slope*(x + W/2), yb - d);
    e.lid.setAttribute('d', `M${-X} ${top(-X)} L${X} ${top(X)} L${X} ${yb} Q0 ${yb - 2*d} ${-X} ${yb} Z`);
  }
}

/* ================================================================
   7. TOUCH – tap = look at finger, hold top = pet, wiggle = tickle
   ================================================================ */
const stage = document.getElementById('stage');
let touch = null;
function setOver(name, ms){ over = fullPreset(name); overUntil = performance.now() + ms; }
function lookAtFinger(x, y){
  fingerGaze = true; gaze = {k:260, z:1};
  wx = clamp((x / innerWidth - .5) * 2.4, -1, 1);
  wy = clamp((y / innerHeight - .5) * 2.4, -1, 1);
}
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  touch = {sx:e.clientX, sy:e.clientY, lx:e.clientX, sg:0, revs:[], moved:0, t0:performance.now(),
           top:e.clientY < innerHeight*.38, pet:false};
  lastInput = performance.now()/1000;
  lookAtFinger(e.clientX, e.clientY);
  interact();
  if (!document.fullscreenElement && document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
});
stage.addEventListener('pointermove', e => {
  if (!touch) return;
  const now = performance.now();
  lastInput = now/1000;
  lookAtFinger(e.clientX, e.clientY);
  touch.moved = Math.max(touch.moved, Math.hypot(e.clientX - touch.sx, e.clientY - touch.sy));
  const dx = e.clientX - touch.lx;                     // count left/right direction flips
  if (Math.abs(dx) > 5){
    const s = Math.sign(dx);
    if (touch.sg && s !== touch.sg) touch.revs.push(now);
    touch.sg = s; touch.lx = e.clientX;
  }
  touch.revs = touch.revs.filter(r => now - r < 900);
  if (touch.revs.length >= 4){ touch.pet = false; setOver('laugh', 700); rate('tickle', 1500); }   // tickle
});
function endTouch(){
  if (!touch) return;
  const now = performance.now();
  if (touch.pet) overUntil = now + 900;
  else if (now - touch.t0 < 350 && touch.moved < 25){ if (!seq) setOver('curious', 900); ev('tap'); pokeCheck(now); }
  touch = null; fingerGaze = false; nextGaze = now/1000 + 1;
}
stage.addEventListener('pointerup', endTouch);
stage.addEventListener('pointercancel', endTouch);
function updateTouch(now){
  if (touch && !touch.pet && touch.top && touch.moved < 50 && now - touch.t0 > 450) touch.pet = true;
  if (touch && touch.pet){ over = fullPreset('pet'); overUntil = Infinity; rate('pet', 3000); }
}

/* ================================================================
   8. MAIN LOOP
   ================================================================ */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.033, (now - last)/1000); last = now;
  const t = now/1000;
  runSeq(now, t); trackStep(now, t); updateTouch(now); updateBlink(t); updateGaze(t);
  step(dt, t, now); render(t);
}
requestAnimationFrame(frame);


/* ================================================================
   9. EMOTION ENGINE – BLIP's inner life
   Seven moods (0-100) + a bond/trust level, saved in localStorage.
   Each mood has a TARGET computed from the situation (time of day,
   how long it was ignored, its personality). The mood drifts toward
   that target slowly; events (pet, praise, scold...) shove it.
   The mood then picks the eye preset – even when nobody is there.
   ================================================================ */
const PERSONALITY = {playful:.8, shy:.45, loyal:.85};      // fixed character
const KEY = 'blip_state_v1';
const STATS = ['energy','happiness','affection','loneliness','boredom','curiosity','anxiety'];
const TAU = {energy:40, happiness:30, affection:120, loneliness:15, boredom:6, curiosity:20, anxiety:12}; // minutes to settle
let fakeHour = null, auto = true, emo = 'neutral', emoSince = 0, sulkUntil = 0, seq = null;
const cd = {};

function fresh(){
  const n = Date.now();
  return {v:1, energy:70, happiness:62, affection:55, loneliness:20, boredom:25, curiosity:60, anxiety:20,
          bond:50, lastSeen:n, lastInteract:n, sleeping:false, isNew:true};
}
function load(){
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.v === 1) return j; } catch(e){}
  return fresh();
}
function save(){ S.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let S = load();

const hourNow = () => fakeHour !== null ? fakeHour : new Date().getHours() + new Date().getMinutes()/60;
const isNight = () => { const h = hourNow(); return h >= 22 || h < 6; };

/* Where each mood "wants" to be right now. */
function targets(idleMin){
  const h = hourNow(), P = PERSONALITY;
  const idleLone = Math.min(65, Math.max(0, idleMin - 3) * .9 * (.8 + .4*P.loyal));   // loyal = misses you more
  const idleBore = Math.min(60, Math.max(0, idleMin - 1) * 2.5);
  return {
    energy:     S.sleeping ? 95 : (isNight() ? 15 : (h >= 20 && h < 22) ? 45 : 72),   // sleepy at night
    loneliness: 15 + 8*P.loyal + idleLone,
    boredom:    22 + idleBore,
    happiness:  55 + 10*P.playful - Math.max(0, S.loneliness - 45) * .5,
    affection:  35 + 20*P.loyal + S.bond * .25,
    curiosity:  50 + 15*P.playful + S.boredom * .15 + 8*Math.sin(Date.now()/600000),
    anxiety:    15 + 18*P.shy + (100 - S.bond) * .1,                                   // shy + low trust = jumpy
  };
}
/* Move moods toward targets. dtMin = minutes elapsed (works for hours offline too). */
function advance(dtMin, idleMin){
  const T = targets(idleMin);
  for (const k of STATS){
    const tau = (k === 'energy' && S.sleeping) ? 8 : TAU[k];
    S[k] = clamp(S[k] + (T[k] - S[k]) * (1 - Math.exp(-dtMin/tau)), 0, 100);
  }
}

/* Events nudge the numbers instantly. */
const EV = {
  pet:     {happiness:4, affection:3, loneliness:-6, boredom:-4, anxiety:-3, bond:.3},
  tickle:  {happiness:5, energy:-3, boredom:-8, loneliness:-4, affection:1},
  tap:     {boredom:-1.5, loneliness:-1.5, curiosity:1},
  praise:  {happiness:12, affection:6, anxiety:-6, loneliness:-8, bond:1.5},
  scold:   {happiness:-15, anxiety:14, affection:-4, bond:-3},
  sadnews: {happiness:-10, anxiety:6, affection:4},
  talk:    {energy:-2.5, boredom:-8, loneliness:-6, curiosity:-3, bond:.3},   // long chats tire it
  poke:    {happiness:-4, anxiety:5, bond:-.4},
  reunion: {loneliness:-15, happiness:8, boredom:-10},
  presence:{loneliness:-1.5, boredom:-1, curiosity:1},      // something moving in front of the camera
};
function ev(name){
  const d = EV[name]; if (!d) return;
  for (const k in d){
    let v = d[k];
    if (k === 'happiness' && v > 0) v *= .6 + S.bond/100;       // low trust = warms up slower
    S[k] = clamp(S[k] + v, 0, 100);
  }
  S.lastInteract = Date.now();
  if (name === 'scold') sulkUntil = Date.now() + 120000;        // sulks for 2 minutes
  emoSince = 0;                                                  // let the face react quickly
}
function rate(name, ms){ const t = Date.now(); if (t - (cd['ev'+name]||0) >= ms){ cd['ev'+name] = t; ev(name); } }
function ready(name, ms){ const t = Date.now(); if (t - (cd[name]||0) < ms) return false; cd[name] = t; return true; }

/* Poking it again and again annoys it. */
let taps = [];
function pokeCheck(now){
  taps = taps.filter(x => now - x < 4000); taps.push(now);
  if (taps.length >= 7 && ready('poke', 4000)){
    ev('poke'); run([{p:'angry', ms:1500, say: S.bond > 60 ? 'hey, hey! stop it!' : 'ow! stop poking me!'}]);
  }
}

/* ---- Mood -> face -------------------------------------------------- */
function scores(){
  return {
    neutral: 12,
    sleepy:  (45 - S.energy) * 2.2,
    lonely:  (S.loneliness - 50) * 2,
    sulky:   (Date.now() < sulkUntil ? 60 : 0) + ((S.loneliness > 70 && S.happiness < 40) ? 40 : 0),
    worried: (S.anxiety - 45) * 2,
    bored:   (S.boredom - 55) * 2,
    curious: (S.curiosity - 68) * 2,
    happy:   (S.happiness - 66) * 2.2,
    excited: (S.happiness > 78 && S.energy > 55) ? (S.happiness - 60) * 2.2 : 0,
  };
}
function pickEmotion(){
  if (!auto) return;
  const sc = scores(); let best = 'neutral', bs = -1e9;
  for (const k in sc) if (sc[k] > bs){ bs = sc[k]; best = k; }
  if (S.sleeping) best = 'asleep';
  // hysteresis: keep the current face for 5 s unless something clearly beats it
  if (best !== emo && (S.sleeping || Date.now() - emoSince > 5000 || bs > (sc[emo] || 0) + 8)){
    emo = best; emoSince = Date.now(); base = fullPreset(emo); currentName = emo; syncUI();
  }
}

/* ---- Captions & scripted behaviours ---------------------------------- */
const capEl = document.getElementById('cap'); let capTimer = 0;
function say(txt, ms = 3200){
  capEl.textContent = txt; capEl.classList.add('on');
  clearTimeout(capTimer); capTimer = setTimeout(() => capEl.classList.remove('on'), ms);
}
// A behaviour is a list of steps: face preset, duration, optional gaze [x,y] and caption.
const B = {
  yawn:  [{p:'sleepy', ms:400}, {p:'squeeze', ms:1400, say:'*yaaawn*'}, {p:'sleepy', ms:600}],
  wake:  [{p:'surprised', ms:500}, {p:'squeeze', ms:700, say:'mm… huh?'}, {p:'sleepy', ms:900}],
  hello: [{p:'curious', ms:2600, g:[0,0], say:'…hello?'}],
  play:  [{p:'bored', ms:700, g:[-.9,0], k:300}, {p:'curious', ms:500, g:[.9,-.2], k:500},
          {p:'excited', ms:500, g:[-.7,.5], k:500, say:'…nothing to do.'}, {p:'excited', ms:500, g:[.8,.4], k:500},
          {p:'bored', ms:900, g:[0,-.8], k:200, say:'wanna play?'}],
};
const ASK = ['what’s the sky like right now?', 'what do you do when I’m asleep?', 'tell me something new?', 'what’s your favourite colour?', 'do you like me?'];
function run(steps){ seq = {steps, i:-1, next:0}; }
function runSeq(now, t){
  if (!seq || now < seq.next) return;
  const st = seq.steps[++seq.i];
  if (!st){ seq = null; return; }
  setOver(st.p, st.ms + 60);
  if (st.g){ wx = st.g[0]; wy = st.g[1]; gaze = {k:st.k || 350, z:1}; nextGaze = t + st.ms/1000; }
  if (st.say) say(st.say);
  seq.next = now + st.ms;
}
function askNow(){ run([{p:'curious', ms:3200, g:[0,-.1], k:200, say:ASK[Math.floor(Math.random()*ASK.length)]}]); }
function greet(){                                    // how it greets depends on how it feels about you
  if (S.bond < 30)            run([{p:'sulky', ms:2400, g:[.6,.2], say:'oh. you’re here.'}]);
  else if (S.loneliness > 55) run([{p:'lonely', ms:700, g:[0,.2]}, {p:'surprised', ms:500, g:[0,0]}, {p:'excited', ms:2400, g:[0,0], say:'…you came back. I missed you.'}]);
  else                        run([{p:'excited', ms:2400, g:[0,0], say:'hi hi!'}]);
}

/* Any touch counts as "you're here". */
function interact(){
  const away = (Date.now() - S.lastInteract) / 60000;
  seq = null;
  if (S.sleeping){ S.sleeping = false; run(B.wake); }
  else if (away > 20){ greet(); ev('reunion'); }
  S.lastInteract = Date.now();
}
function warp(min){                                   // debug: pretend it was ignored for a while
  S.lastInteract -= min*60000;
  advance(min, (Date.now() - S.lastInteract) / 60000);
  emoSince = 0; pickEmotion(); say('…' + (min/60) + 'h later');
}

/* Things it starts on its own, checked once a second. */
function autonomy(){
  const busy = seq || touch || (over && performance.now() < overUntil);
  const idleSec = (Date.now() - S.lastInteract) / 1000;
  if (!S.sleeping && idleSec > 45 && (S.energy < 18 || (isNight() && S.energy < 40))){ S.sleeping = true; say('*zzz*'); }
  if (S.sleeping && S.energy > 92 && !isNight()) S.sleeping = false;
  if (busy || S.sleeping) return;
  if (S.energy < 40 && Math.random() < .15 && ready('yawn', 90000)) run(B.yawn);
  else if (S.boredom > 65 && Math.random() < .2 && ready('play', 60000)) run(B.play);
  else if (S.curiosity > 70 && S.boredom < 65 && Math.random() < .1 && ready('ask', 150000)) askNow();
}

/* ---- Heartbeat: update moods, behaviours and face once a second ------- */
let lastTick = Date.now();
setInterval(() => {
  const n = Date.now(), dt = (n - lastTick)/60000; lastTick = n;
  advance(dt, (n - S.lastInteract)/60000);
  autonomy(); pickEmotion();
}, 1000);
setInterval(save, 5000);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* Startup: catch up on the time it was alone, then react to it. */
setTimeout(() => {   // deferred so the debug panel below exists before the first face update
  const n = Date.now(), awayMin = (n - S.lastSeen)/60000;
  if (S.isNew){ delete S.isNew; setTimeout(() => run(B.hello), 1500); }
  else if (awayMin > 1){
    S.sleeping = false;
    advance(awayMin, (n - S.lastInteract)/60000);
    const hrs = awayMin/60;
    if (hrs > 24) S.bond = clamp(S.bond - Math.min(8, (hrs - 24) * .15), 0, 100);   // long absence hurts trust
    if (awayMin > 20) setTimeout(() => { greet(); ev('reunion'); }, 1500);
  }
  S.lastInteract = awayMin > 20 ? n : S.lastInteract;
  pickEmotion(); save();
}, 0);

/* ================================================================
   11. VISION – follow a moving object in front of the screen.
   No libraries: the front camera is shrunk to 64x48, compared with a
   slowly-updating background, and the centre of whatever changed is
   where BLIP looks. (The camera image is mirrored: left/right flipped.)
   ================================================================ */
const vid = document.createElement('video'); vid.setAttribute('playsinline', ''); vid.muted = true;
const cvs = document.createElement('canvas'); cvs.width = 64; cvs.height = 48;
const cctx = cvs.getContext('2d', {willReadFrequently:true});
let camOn = false, camStream = null, camTimer = 0, avg = null;
let seenAt = -1e9, seenX = .5, seenY = .5, trackGaze = false, wasTracking = false;
const camBtn = document.getElementById('cam');

async function startCam(){
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:320}, height:{ideal:240}}, audio:false});
    vid.srcObject = camStream; await vid.play();
    camOn = true; avg = null; camBtn.classList.add('on');
    camTimer = setInterval(vision, 70);                      // ~14 checks per second
    say('I can see you now…');
  } catch(e){ camOn = false; camBtn.classList.remove('on'); say('camera blocked – open the page directly in Chrome and allow the camera', 5000); }
}
function stopCam(){
  clearInterval(camTimer); if (camStream) camStream.getTracks().forEach(tr => tr.stop());
  camStream = null; camOn = false; trackGaze = false; camBtn.classList.remove('on');
}
function toggleCam(){ camOn ? stopCam() : startCam(); }
camBtn.addEventListener('click', toggleCam);

function vision(){
  if (vid.readyState < 2) return;
  cctx.drawImage(vid, 0, 0, 64, 48);
  const d = cctx.getImageData(0, 0, 64, 48).data, n = 64*48;
  if (!avg){ avg = new Float32Array(n); for (let i = 0; i < n; i++) avg[i] = d[i*4]*.3 + d[i*4+1]*.59 + d[i*4+2]*.11; }
  let cnt = 0, sx = 0, sy = 0;
  for (let i = 0; i < n; i++){
    const g = d[i*4]*.3 + d[i*4+1]*.59 + d[i*4+2]*.11, df = Math.abs(g - avg[i]);
    avg[i] += (g - avg[i]) * .05;                            // background slowly forgets
    if (df > 28){ cnt++; sx += i % 64; sy += (i / 64) | 0; }
  }
  // enough pixels moved (an object), but not the whole picture (camera shake / lighting flicker)
  if (cnt > 38 && cnt < n*.6){
    const x = sx/cnt/64, y = sy/cnt/48, now = performance.now();
    if (now - seenAt < 600){ seenX += (x - seenX)*.5; seenY += (y - seenY)*.5; } else { seenX = x; seenY = y; }
    seenAt = now;
  }
}
/* Called every frame: point the gaze at what the camera saw (finger on screen wins). */
function trackStep(now, t){
  const seen = camOn && !S.sleeping && !touch && (now - seenAt) < 1500;
  trackGaze = seen;
  if (seen){
    wx = clamp((.5 - seenX) * 2.5, -1, 1);                   // mirrored: object on your right -> eyes look right
    wy = clamp((seenY - .5) * 2.5, -1, 1);
    gaze = {k:380, z:1}; nextGaze = t + .4;
    if (!wasTracking){ if (!seq) setOver('curious', 900); rate('presence', 5000); }
  }
  wasTracking = seen;
}

/* ================================================================
   10. DEBUG PANEL
   ================================================================ */
const panel = document.getElementById('panel');
const sliders = {};
function h(tag, props, kids){
  const n = Object.assign(document.createElement(tag), props || {});
  (kids || []).forEach(k => n.append(k));
  return n;
}
const btnWrap = h('div', {className:'btns'});
const btnEls = {};
Object.keys(PRESETS).forEach(name => {
  btnEls[name] = h('button', {textContent:name, onclick(){
    auto = false; autoBox.checked = false; base = fullPreset(name); currentName = name; nextBlink = Math.min(nextBlink, performance.now()/1000 + .2);
    syncUI();
  }});
  btnWrap.append(btnEls[name]);
});
const lifeBox = h('input', {type:'checkbox', checked:true, onchange(){ life = lifeBox.checked; }});
const autoBox = h('input', {type:'checkbox', checked:true, onchange(){ auto = autoBox.checked; if (auto){ emoSince = 0; pickEmotion(); } }});
const tools = h('div', {className:'tools'}, [
  h('button', {textContent:'Fullscreen', onclick(){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); }}),
  h('button', {textContent:'Copy values', onclick(){
    const out = {}; PARAMS.forEach(p => { if (Math.abs(base[p.id] - DEF[p.id]) > .001) out[p.id] = +(+base[p.id]).toFixed(2); });
    const txt = JSON.stringify(out);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => prompt('Copy:', txt));
  }}),
  h('label', {style:'flex:1;color:#9ab;font-size:11px;text-align:center'}, [lifeBox, ' idle life']),
  h('label', {style:'flex:1;color:#9ab;font-size:11px;text-align:center'}, [autoBox, ' engine']),
]);
const feel = h('div', {id:'feel'});
const statRows = {};
const STAT_ORDER = ['energy','happiness','affection','loneliness','boredom','curiosity','anxiety','bond'];
panel.append(feel);
STAT_ORDER.forEach(k => {
  const bar = h('i'), out = h('output');
  statRows[k] = {bar, out};
  panel.append(h('div', {className:'row'}, [h('label', {textContent:k}), h('div', {className:'bar'}, [bar]), out]));
});
const mkBtns = (title, list) => {
  panel.append(h('div', {className:'sec', textContent:title}));
  panel.append(h('div', {className:'btns'}, list.map(([n, f]) => h('button', {textContent:n, onclick:f}))));
};
mkBtns('Events (things that happen to it)', [
  ['pet', () => { ev('pet'); setOver('pet', 1800); }], ['tickle', () => { ev('tickle'); setOver('laugh', 1800); }],
  ['praise', () => { ev('praise'); run([{p:'happy', ms:2200, say:'hehe… really?'}]); }],
  ['scold', () => { ev('scold'); run([{p:'sad', ms:2600, say:'…ok. sorry.'}]); }],
  ['sad news', () => { ev('sadnews'); run([{p:'sad', ms:3200, say:'oh no… I’m here.'}]); }],
  ['talk turn', () => { ev('talk'); setOver('curious', 1200); }],
]);
mkBtns('Self-started behaviours', [
  ['greet', () => greet()], ['yawn', () => run(B.yawn)], ['play', () => run(B.play)], ['ask', () => askNow()],
]);
mkBtns('Vision (front camera)', [['camera on/off', () => toggleCam()]]);
mkBtns('Time & state', [
  ['+1h ignored', () => warp(60)], ['+6h ignored', () => warp(360)],
  ['night/day', () => { fakeHour = fakeHour === 2 ? 13 : 2; say('pretending it’s ' + (fakeHour === 2 ? '2 am' : '1 pm')); }],
  ['reset all', () => { S = fresh(); delete S.isNew; emoSince = 0; pickEmotion(); save(); }],
]);
panel.append(h('div', {className:'sec', textContent:'Eye tuning'}), btnWrap, tools);
PARAMS.forEach(p => {
  const out = h('output');
  const inp = h('input', {type:'range', min:p.min, max:p.max, step:(p.max-p.min)/200, value:p.def,
    oninput(){ base[p.id] = +inp.value; out.textContent = (+inp.value).toFixed(2); }});
  sliders[p.id] = {inp, out};
  panel.append(h('div', {className:'row'}, [h('label', {textContent:p.label}), inp, out]));
});
function syncUI(){
  PARAMS.forEach(p => { sliders[p.id].inp.value = base[p.id]; sliders[p.id].out.textContent = (+base[p.id]).toFixed(2); });
  Object.keys(btnEls).forEach(n => btnEls[n].classList.toggle('cur', n === currentName));
}
syncUI();
setInterval(() => {                       // live readout while the panel is open
  if (!panel.classList.contains('on')) return;
  STAT_ORDER.forEach(k => { statRows[k].bar.style.width = S[k].toFixed(0) + '%'; statRows[k].out.textContent = S[k].toFixed(0); });
  feel.textContent = 'feeling: ' + (S.sleeping ? 'asleep' : emo) + (fakeHour !== null ? '  (fake clock)' : '') + (camOn ? (trackGaze ? '  · following something' : '  · camera on') : '');
}, 500);
document.getElementById('gear').addEventListener('click', () => panel.classList.toggle('on'));
})();
</script>
</body>
